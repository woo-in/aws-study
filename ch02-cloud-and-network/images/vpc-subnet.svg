<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <rect x="0.5" y="0.5" width="879" height="359" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">큰 네트워크를 잡아 두고, 그 안을 작게 나눈다</text>

  <!-- AWS cloud -->
  <rect x="36" y="62" width="808" height="272" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="56" y="86" font-size="13" font-weight="700" fill="#475569">AWS 클라우드</text>

  <!-- VPC -->
  <rect x="64" y="100" width="752" height="210" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="84" y="126" font-size="15" font-weight="700" fill="#6d28d9">VPC</text>
  <text x="128" y="126" font-family="monospace" font-size="14" font-weight="700" fill="#6d28d9">10.0.0.0/16</text>
  <text x="796" y="126" text-anchor="end" font-size="12" fill="#7c3aed">10.0.0.0 ~ 10.0.255.255 · 나만의 사설 네트워크</text>

  <!-- subnets -->
  <rect x="92" y="146" width="336" height="140" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="112" y="172" font-size="14" font-weight="700" fill="#047857">서브넷 A</text>
  <text x="186" y="172" font-family="monospace" font-size="13" font-weight="700" fill="#047857">10.0.1.0/24</text>
  <text x="112" y="194" font-size="12" fill="#047857">10.0.1.0 ~ 10.0.1.255 · 예) 웹 서버용</text>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="112" y="210" width="140" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="182" y="234">EC2</text>
    <text x="182" y="252" font-family="monospace" font-weight="400" fill="#475569">10.0.1.10</text>
    <rect x="268" y="210" width="140" height="56" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="338" y="234">EC2</text>
    <text x="338" y="252" font-family="monospace" font-weight="400" fill="#475569">10.0.1.11</text>
  </g>

  <rect x="452" y="146" width="336" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="472" y="172" font-size="14" font-weight="700" fill="#1d4ed8">서브넷 B</text>
  <text x="546" y="172" font-family="monospace" font-size="13" font-weight="700" fill="#1d4ed8">10.0.2.0/24</text>
  <text x="472" y="194" font-size="12" fill="#1d4ed8">10.0.2.0 ~ 10.0.2.255 · 예) DB용</text>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <rect x="472" y="210" width="140" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="542" y="234">RDS</text>
    <text x="542" y="252" font-family="monospace" font-weight="400" fill="#475569">10.0.2.20</text>
  </g>
  <text x="700" y="236" text-anchor="middle" font-size="12" fill="#475569">/24 → 251개 사용 가능</text>
  <text x="700" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">(AWS가 5개 예약)</text>
</svg>
