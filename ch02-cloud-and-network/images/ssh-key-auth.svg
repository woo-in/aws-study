<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ec7211"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="440" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">SSH 키 인증 — 비밀번호 대신 키 한 쌍으로</text>

  <!-- My PC -->
  <rect x="40" y="70" width="260" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="170" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">내 PC</text>
  <rect x="68" y="116" width="204" height="60" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="170" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">🔑 개인 키 (.pem)</text>
  <text x="170" y="162" text-anchor="middle" font-size="12" fill="#991b1b">절대 밖으로 내보내지 않는다</text>
  <rect x="68" y="192" width="204" height="44" rx="8" fill="#0f172a"/>
  <text x="170" y="219" text-anchor="middle" font-family="monospace" font-size="11" fill="#e2e8f0">$ ssh -i key.pem ec2-user@IP</text>

  <!-- channel -->
  <line x1="308" y1="140" x2="572" y2="140" stroke="#ec7211" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">① 접속 요청</text>
  <line x1="572" y1="190" x2="308" y2="190" stroke="#ec7211" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">② 개인 키를 가졌는지 확인</text>
  <text x="440" y="212" text-anchor="middle" font-size="12" fill="#475569">짝이 맞으면 접속 허용</text>
  <rect x="340" y="226" width="200" height="26" rx="13" fill="#dcfce7"/>
  <text x="440" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">🔒 전 구간 암호화 · 포트 22</text>

  <!-- Server -->
  <rect x="580" y="70" width="260" height="190" rx="12" fill="#fff7ed" stroke="#ec7211"/>
  <text x="710" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">서버 (EC2)</text>
  <rect x="608" y="116" width="204" height="60" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="710" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">🔓 공개 키</text>
  <text x="710" y="162" text-anchor="middle" font-size="12" fill="#9a3412">~/.ssh/authorized_keys</text>
  <text x="710" y="206" text-anchor="middle" font-size="12" fill="#475569">키 페어 생성 시</text>
  <text x="710" y="224" text-anchor="middle" font-size="12" fill="#475569">인스턴스에 자동으로 들어간다</text>

  <!-- telnet note -->
  <rect x="40" y="276" width="800" height="36" rx="8" fill="#f1f5f9"/>
  <text x="440" y="299" text-anchor="middle" font-size="12" fill="#475569">Telnet은 아이디 · 비밀번호가 평문으로 오갔다 → SSH가 암호화 + 키 인증으로 대체</text>
</svg>
